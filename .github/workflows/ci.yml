name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Start the service
        run: java -jar service/target/service.jar > service.log 2>&1 &

      - name: Smoke test against the running service
        run: eng/scripts/smoke.sh http://localhost:8080

      - name: Service log
        if: always()
        run: cat service.log || true

      - name: Build Docker image
        run: docker build -f service/Dockerfile -t countries-api .
